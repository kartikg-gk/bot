[project]
name = "delta-gateway"
version = "0.1.0"
description = "A subprocess gateway for persistent Delta sessions"
requires-python = ">=3.12"
dependencies = ["deltaa>=0.3.0", "pydantic>=2.7", "httpx>=0.27", "python-telegram-bot>=22.7,<23", "PyYAML>=6", "prompt-toolkit>=3", "packaging>=24"]

[project.scripts]
delta-gateway = "delta_gateway.cli:main"

[project.optional-dependencies]
memory = [
    "fastembed>=0.5",
    "mem0ai>=2.2.1",
    "qdrant-client>=1.12",
]
daytona = [
    "daytona>=0.227.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv.sources]
deltaa = { path = "../delta", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"systemd/delta-gateway.service" = "delta_gateway/data/delta-gateway.service"

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/systemd", "/docs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
