<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delta Gateway</title>
<style>
:root {
  --bg: #f3f5f4; --panel: #ffffff; --fg: #18211f; --muted: #5d6b67; --line: #d6dddb;
  --accent: #1f6b5c; --accent-fg: #ffffff; --you: #e3efec; --warn: #8a4b08;
  font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111715; --panel: #18201e; --fg: #e4ebe9; --muted: #95a39f; --line: #2c3633;
    --accent: #5fbfa8; --accent-fg: #0d1513; --you: #1d2d29; --warn: #e8b36e; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh; display: grid;
  grid-template-columns: 1fr 280px; }
main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; height: 100vh; }
header { padding: 12px 20px; border-bottom: 1px solid var(--line); font-weight: 600; }
#log { overflow-y: auto; padding: 16px 20px; display: grid; gap: 10px; align-content: start; }
.message { max-width: 72ch; padding: 10px 14px; border-radius: 8px; background: var(--panel);
  border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.message.you { background: var(--you); justify-self: end; }
.message .buttons { display: flex; gap: 8px; margin-top: 8px; }
.draft { color: var(--muted); font-style: italic; white-space: pre-wrap; }
form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 40vh; padding: 10px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg);
  font: inherit; }
button { border: 0; border-radius: 6px; padding: 8px 14px; background: var(--accent);
  color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
button.quiet { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent);
  outline-offset: 2px; }
aside { border-left: 1px solid var(--line); padding: 12px 16px; overflow-y: auto; height: 100vh; }
aside h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.05em; }
.task { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.task b { font-variant-numeric: tabular-nums; }
#login { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; }
#login[hidden] { display: none; }
#login form { border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  flex-direction: column; width: min(360px, 90vw); }
#login input { padding: 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit;
  background: var(--bg); color: var(--fg); }
#error { color: var(--warn); min-height: 1.5em; }
@media (max-width: 700px) { body { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<main>
  <header>Delta Gateway</header>
  <div id="log" aria-live="polite"></div>
  <form id="compose">
    <textarea id="text" placeholder="Message your bot, or a /command" required></textarea>
    <button type="submit">Send</button>
  </form>
</main>
<aside>
  <h2>Background tasks</h2>
  <div id="tasks">No tasks yet.</div>
</aside>
<div id="login" hidden>
  <form id="token-form">
    <label for="token">Web token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <div id="error"></div>
    <button type="submit">Open</button>
  </form>
</div>
<script>
let token = sessionStorage.getItem("delta-token") || "";
const log = document.getElementById("log");
const drafts = document.createElement("div");
drafts.className = "draft";
const shown = new Map();

function api(path, options = {}) {
  return fetch(path, { ...options, headers: { ...(options.headers || {}),
    Authorization: "Bearer " + token, "Content-Type": "application/json" } });
}

function add(text, you, id, buttons = []) {
  const box = document.createElement("div");
  box.className = "message" + (you ? " you" : "");
  box.textContent = text;
  if (buttons.length) {
    const row = document.createElement("div");
    row.className = "buttons";
    for (const button of buttons) {
      const element = document.createElement("button");
      element.textContent = button.text;
      element.className = button.data.startsWith("d:") ? "quiet" : "";
      element.onclick = async () => {
        row.remove();
        await api("/api/approvals", { method: "POST",
          body: JSON.stringify({ data: button.data, allow: button.data.startsWith("a:") }) });
      };
      row.append(element);
    }
    box.append(row);
  }
  log.insertBefore(box, drafts.isConnected ? drafts : null);
  if (id) shown.set(id, box);
  log.scrollTop = log.scrollHeight;
}

async function follow() {
  const response = await api("/api/stream");
  if (!response.ok) throw new Error(response.status);
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += value;
    let end;
    while ((end = buffer.indexOf("\n\n")) >= 0) {
      const chunk = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      if (!chunk.startsWith("data: ")) continue;
      const record = JSON.parse(chunk.slice(6));
      if (record.type === "message" && record.text !== "Working…") {
        drafts.remove();
        add(record.text, false, record.id, record.buttons);
      } else if (record.type === "draft") {
        drafts.textContent = record.text;
        log.append(drafts);
        log.scrollTop = log.scrollHeight;
      } else if (record.type === "edit" && shown.has(record.id)) {
        shown.get(record.id).textContent = record.text;
      } else if (record.type === "file") {
        add("File " + record.name + " (" + record.content.length + " characters)", false);
      }
    }
  }
}

async function loadTasks() {
  const response = await api("/api/tasks");
  if (!response.ok) return;
  const rows = await response.json();
  const list = document.getElementById("tasks");
  list.replaceChildren(...rows.map((task) => {
    const row = document.createElement("div");
    row.className = "task";
    row.innerHTML = "<b></b> <span></span><div></div>";
    row.children[0].textContent = "#" + task.id + " " + task.status;
    row.children[1].textContent = task.bot;
    row.children[2].textContent = task.goal;
    return row;
  }));
  if (!rows.length) list.textContent = "No tasks yet.";
}

async function open() {
  const response = await api("/api/messages");
  if (response.status === 401) {
    document.getElementById("login").hidden = false;
    return;
  }
  document.getElementById("login").hidden = true;
  for (const row of await response.json()) add(row.text, row.direction === "inbound");
  loadTasks();
  setInterval(loadTasks, 5000);
  for (;;) {
    try { await follow(); } catch (error) { /* reconnect below */ }
    await new Promise((resolve) => setTimeout(resolve, 2000));
  }
}

document.getElementById("token-form").onsubmit = (event) => {
  event.preventDefault();
  token = document.getElementById("token").value;
  try { sessionStorage.setItem("delta-token", token); } catch (error) {}
  open();
};

document.getElementById("compose").onsubmit = async (event) => {
  event.preventDefault();
  const field = document.getElementById("text");
  const text = field.value.trim();
  if (!text) return;
  field.value = "";
  add(text, true);
  const response = await api("/api/messages", { method: "POST", body: JSON.stringify({ text }) });
  if (!response.ok) add("Not sent: " + (await response.json()).error, false);
};

document.getElementById("text").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    document.getElementById("compose").requestSubmit();
  }
});

open();
</script>
</body>
</html>
